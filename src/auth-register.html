@@include("partials/main.html")

<head>
    @@include("partials/title-meta.html", {"title": "Rules Manager - Admin Register"})
    @@include("partials/head-css.html") 
    <script>
        if (sessionStorage.getItem('isLoggedIn')) { window.location.href = 'index.html'; }
    </script>
    <style>
        .auth-card {
            min-height: 580px;
            display: flex;
            flex-direction: column;
        }
        .auth-icon-container {
            background-color: #ffffff !important;
            border-color: #ced4da !important;
            border-right: none !important;
            width: 48px;
            justify-content: center;
        }
        .auth-icon-container i { font-size: 18px !important; color: #38c66c !important; }
        .border-dashed { border-style: solid !important; }

        .form-control::placeholder {
            font-style: normal !important;
        }

        .form-control {
            height: 42px;
            border-color: #ced4da !important;
            border-left: none !important;
        }
    </style>
</head> 

<body class="bg-light">

<div class="container-fluid" id="registerApp">
    <div class="row align-items-center justify-content-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="card border-0 shadow-sm auth-card">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="text-center mb-4 mt-2">
                        <a href="index.html" class="logo d-block mb-4">
                            <img src="assets/images/logo-dark.png" alt="Clivax Logo" height="24" class="mx-auto">
                        </a>
                        <h4 class="text-primary fw-bold">Create Account</h4>
                        <p class="text-muted">Enter your details to register</p>
                    </div>

                    <div class="flex-grow-1 d-flex flex-column justify-content-center px-lg-4">
                        <form @submit.prevent="register">
                            <div class="input-group mb-3 w-100">
                                <span class="input-group-text border-dashed border-end-0 auth-icon-container">
                                    <i class="mdi mdi-account-outline"></i>
                                </span>
                                <input type="text" v-model="form.username" class="form-control border-dashed border-start-0 ps-0" placeholder="+254 700 000 000" required>
                            </div>

                            <div class="input-group mb-4 w-100">
                                <span class="input-group-text border-dashed border-end-0 auth-icon-container">
                                    <i class="mdi mdi-lock-outline"></i>
                                </span>
                                <input type="password" v-model="form.password" class="form-control border-dashed border-start-0 ps-0" placeholder="Create a password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-75 mx-auto d-block btn-sm waves-effect waves-light" :disabled="isLoading">
                                Register Now
                            </button>

                            <div class="mt-4 text-center">
                                <p class="mb-0 text-muted small">Already have an account? <a href="auth-login.html" class="fw-semibold text-primary"> Login </a></p>
                            </div>
                        </form>
                    </div>

                    <div class="mt-auto text-center pt-3">
                        <p class="mb-0 text-muted small">© <script>document.write(new Date().getFullYear())</script> Clivax. Crafted with <i class="mdi mdi-heart text-danger"></i></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
