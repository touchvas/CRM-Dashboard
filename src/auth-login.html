@@include("partials/main.html")

<head>
    @@include("partials/title-meta.html", {"title": "Rules Manager - Admin Login"})
    @@include("partials/head-css.html") 
</head> 

<body class="bg-light">

<div class="container-fluid" id="loginApp">
    <div class="row align-items-center justify-content-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body px-3 py-2">

                    <!-- Login Alerts -->
                    <div v-if="alert_error" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                        {{ alert_message }}
                        <button type="button" class="btn-close" @click="alert_error = false"></button>
                    </div>
                    <div v-if="alert_success" class="alert alert-success py-2 small" role="alert">
                        {{ alert_message }}
                    </div>

                    <!-- Login form -->
                    <form v-if="doLogin" @submit.prevent="login" class="mt-1">
                        <div class="mb-2 row align-items-center">
                            <label class="col-sm-3 col-form-label small text-muted">Username</label>
                            <div class="col-sm-9">
                                <input
                                    type="text"
                                    v-model="username"
                                    class="form-control form-control-sm"
                                    placeholder="+254 700 000 000"
                                >
                            </div>
                        </div>

                        <div class="mb-1 row align-items-center">
                            <label class="col-sm-3 col-form-label small text-muted">Password</label>
                            <div class="col-sm-9">
                                <input
                                    type="password"
                                    v-model="password"
                                    class="form-control form-control-sm"
                                    placeholder="Enter your password"
                                >
                            </div>
                        </div>

                        <div class="text-end mb-2">
                            <a href="auth-recoverpw.html" class="text-muted small text-decoration-none">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-sm waves-effect waves-light" :disabled="isLoading">
                            <span v-if="isLoading" class="spinner-border spinner-border-sm me-1"></span>
                            {{ isLoading ? 'signing in...' : 'sign in' }}
                        </button>
                    </form>

                    <!-- OTP form -->
                    <!-- <form v-if="doOtp" @submit.prevent="otp" class="mt-1">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Verification code</label>
                            <input
                                type="text"
                                v-model="code"
                                class="form-control form-control-sm"
                                placeholder="Enter code"
                            >
                        </div>
                        <button type="submit" class="btn btn-dark w-100 btn-sm waves-effect waves-light" :disabled="isLoading">
                            <span v-if="isLoading" class="spinner-border spinner-border-sm me-1"></span>
                            {{ isLoading ? 'Verifying...' : 'Verify OTP' }}
                        </button>
                    </form> -->

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Includes all shared libraries, Vue, and app.js in the correct order -->
@@include("partials/vendor-scripts.html")

</body>
</html>
