<style>
    .dropdown-item:hover,
    .dropdown-item:focus {
        color: var(--bs-primary) !important;
        background-color: var(--bs-light) !important;
    }
</style>



<div id="app">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box d-flex px-2 align-items-center justify-content-between">
                <style>
                    .dropdown-item:hover,
                    .dropdown-item:focus {
                        color: var(--bs-primary) !important;
                        background-color: var(--bs-light) !important;
                    }
                </style>
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="javascript: void(0);">Analytics</a></li>
                        <li class="breadcrumb-item active">Segmentation</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Query Builder -->
        <div class="col-12">

            <div  class="card">
                <div class="card-header d-flex justify-content-between align-items-center bg-transparent border-bottom">
                    <button type="button" class="btn-close" @click="isCreating = false"></button>
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <div class="row">
                            <div class="col-md-8">
                                <label class="form-label font-size-14 fw-semibold text-muted text-uppercase">Segment
                                    Name</label>
                                <input type="text" class="form-control form-control-lg border-dashed"
                                    v-model="segmentName"
                                    placeholder="Enter segment name (e.g., High-Value UK Players)">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-size-14 fw-semibold text-muted text-uppercase">Refresh Type</label>
                                <select class="form-select form-select-lg border-dashed" v-model="refreshType">
                                    <option value="REAL_TIME">Real-time (Flink)</option>
                                    <option value="BATCH">Batch (On-demand)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label font-size-14 fw-semibold text-muted text-uppercase">Logic Pattern</label>
                        <select class="form-select border-dashed w-auto" v-model="criteria.operator">
                            <option value="AND">Match ALL conditions (AND)</option>
                            <option value="OR">Match ANY condition (OR)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-size-14 fw-semibold text-muted text-uppercase">Rules &
                            Conditions</label>
                        <p class="text-muted font-size-13 mb-3">Define users who meet the following criteria:</p>

                        <div id="rules-container">
                            <!-- Rule Row -->
                            <div v-for="(rule, index) in criteria.rules" :key="index" class="condition-row row g-3 align-items-end mb-3">
                                <!-- FIELD -->
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-muted text-uppercase">User Property</label>
                                    <select class="form-select border-dashed bg-white" v-model="rule.field"
                                        @change="rule.operator = ''; rule.value = ''">
                                        <option value="" disabled selected hidden>Select field...</option>
                                        <option v-for="config in availableFields" :key="config.field"
                                            :value="config.field">
                                            {{ config.label || config.field }}
                                        </option>
                                    </select>
                                </div>

                                <!-- OPERATOR -->
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold text-muted text-uppercase">Condition</label>
                                    <select class="form-select border-dashed bg-white" v-model="rule.operator" :disabled="!rule.field">
                                        <option value="" disabled selected hidden>Select operator...</option>
                                        <template v-if="rule.field">
                                            <option v-for="op in (availableFields.find(f => f.field === rule.field)?.operators || ['=', '>', '<', 'IN', 'NOT IN'])" 
                                                :key="op" :value="op">
                                                {{ op.toUpperCase() }}
                                            </option>
                                        </template>
                                    </select>
                                </div>

                                <!-- VALUE -->
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-muted text-uppercase">Value</label>

                                    <!-- ENUM -->
                                    <select v-if="rule.field && availableFields.find(f => f.field === rule.field)?.values"
                                        v-model="rule.value" class="form-select border-dashed bg-white" :disabled="!rule.operator">
                                        <option value="" disabled selected hidden>Select value...</option>
                                        <option v-for="val in availableFields.find(f => f.field === rule.field).values" :key="val"
                                            :value="val">{{ val }}</option>
                                    </select>

                                    <!-- NUMBER -->
                                    <input v-else-if="rule.field && availableFields.find(f => f.field === rule.field)?.type === 'number'"
                                        type="number" class="form-control border-dashed bg-white" v-model.number="rule.value"
                                        placeholder="Enter number" :disabled="!rule.operator" />

                                    <!-- STRING -->
                                    <input v-else-if="rule.field && availableFields.find(f => f.field === rule.field)?.type === 'string'"
                                        type="text" class="form-control border-dashed bg-white" v-model="rule.value" placeholder="Enter text"
                                        :disabled="!rule.operator" />

                                    <!-- DATE -->
                                    <input v-else-if="rule.field && availableFields.find(f => f.field === rule.field)?.type === 'date'"
                                        type="date" class="form-control" v-model="rule.value"
                                        :disabled="!rule.operator" />

                                    <!-- PLACEHOLDER when no field selected -->
                                    <input v-else type="text" class="form-control" placeholder="Select a field first"
                                        disabled />
                                </div>

                                <!-- DELETE BUTTON -->
                                <div class="col-md-1 text-center">
                                    <button class="btn btn-soft-danger btn-sm" @click="removeCondition(index)" :disabled="criteria.rules.length <= 1"><i
                                            class="mdi mdi-trash-can-outline"></i></button>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-soft-primary w-100 py-2 border-dashed mt-2" @click="addCondition">
                            <i class="mdi mdi-plus-circle-outline me-1"></i> Add Condition
                        </button>
                    </div>
                        <div class="hstack gap-2">
                            <button class="btn btn-light px-4" @click="isCreating = false">Cancel</button>
                            <button class="btn btn-primary px-4"
                                @click="saveCurrentSegment(segmentName || 'Unnamed Segment')"><i
                                    class="mdi mdi-content-save-outline me-1"></i>
                                Save
                                Segment</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>


    </div>
