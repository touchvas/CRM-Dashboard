<!-- Start topbar -->
<header id="page-topbar" class="glass-effect">
    <div class="navbar-header d-flex align-items-center justify-content-between w-100">

        <!-- Logo Area -->
        <div class="navbar-logo-box d-flex align-items-center">
            <a href="index.html" class="logo logo-dark me-4">
                <span class="logo-sm">
                    <img src="/assets/images/logo-sm.png" alt="logo-sm-dark" height="24">
                </span>
                <span class="logo-lg">
                    <img src="/assets/images/logo-dark.png" alt="logo-dark" height="22">
                </span>
            </a>

            <button type="button" class="btn btn-sm top-icon sidebar-btn" id="sidebar-btn">
                <i class="mdi mdi-menu-variant align-middle fs-22"></i>
            </button>
        </div>

        <!-- Center Area (Empty for spacing) -->
        <div class="flex-grow-1 d-none d-lg-flex"></div>

        <!-- Right Side: Search, Notifications, Profile -->
        <div class="d-flex align-items-center gap-3 pe-2">

            <!-- Search Bar -->
            <form class="app-search d-none d-xl-block" style="width: 320px;">
                <div class="position-relative">
                    <input type="text" class="form-control bg-light-subtle border-0 shadow-sm" placeholder="Search..."
                        style="padding-left: 40px; height: 38px; border-radius: 10px; font-size: 13px;">
                    <span class="fas fa-search position-absolute text-muted"
                        style="top: 11px; left: 15px; font-size: 14px;"></span>
                </div>
            </form>

            <!-- Notifications -->
            <div class="dropdown d-inline-block">
                <button type="button"
                    class="btn btn-icon btn-topbar rounded-circle border border-2 border-primary border-opacity-10"
                    id="page-header-notifications-dropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="ri-notification-3-line fs-20 text-primary"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        style="margin-top: 10px; margin-left: -10px; padding: 3px 4px; font-size: 8px; border: 1px solid #fff;">
                        3
                    </span>
                </button>
                <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0 shadow-lg border-0 animated-dropdown"
                    aria-labelledby="page-header-notifications-dropdown"
                    style="border-radius: 16px; overflow: hidden; width: 340px;">
                    <div class="p-3 bg-primary bg-gradient">
                        <div class="row align-items-center">
                            <div class="col">
                                <h6 class="text-white m-0 fw-bold">Notifications</h6>
                            </div>
                            <div class="col-auto">
                                <span class="badge bg-white bg-opacity-20 text-white">3 New</span>
                            </div>
                        </div>
                    </div>
                    <div data-simplebar style="max-height: 300px;">
                        <a href="#!"
                            class="text-reset notification-item d-block p-3 border-bottom border-light hover-bg-light transition-all">
                            <div class="d-flex align-items-center">
                                <div class="avatar-xs me-3 flex-shrink-0">
                                    <span class="avatar-title bg-info-subtle text-info rounded-circle fs-16">
                                        <i class="ri-user-follow-line"></i>
                                    </span>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="mb-1 small fw-bold text-dark text-truncate">New segment member added</h6>
                                    <p class="mb-0 fs-12 text-muted">A new player joined "High Rollers"</p>
                                </div>
                                <span class="fs-11 text-muted ms-2">2m</span>
                            </div>
                        </a>
                        <a href="#!"
                            class="text-reset notification-item d-block p-3 border-bottom border-light hover-bg-light transition-all">
                            <div class="d-flex align-items-center">
                                <div class="avatar-xs me-3 flex-shrink-0">
                                    <span class="avatar-title bg-success-subtle text-success rounded-circle fs-16">
                                        <i class="ri-mail-send-line"></i>
                                    </span>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="mb-1 small fw-bold text-dark text-truncate">Campaign completed</h6>
                                    <p class="mb-0 fs-12 text-muted">Successfully delivered to 4.2k users</p>
                                </div>
                                <span class="fs-11 text-muted ms-2">1h</span>
                            </div>
                        </a>
                    </div>
                    <div class="p-2 border-top text-center bg-light-subtle">
                        <a class="btn btn-sm btn-link fw-bold text-primary text-decoration-none"
                            href="javascript:void(0)">
                            View All Activity <i class="ri-arrow-right-line ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Profile Dropdown -->
            <div class="dropdown d-inline-block">
                <button type="button" class="btn btn-topbar p-1 ms-1" id="page-header-user-dropdown"
                    data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <div class="d-flex align-items-center">
                        <img class="rounded-circle header-profile-user border border-2 border-primary border-opacity-10"
                            src="assets/images/users/avatar-6.png" alt="Header Avatar"
                            style="width: 38px; height: 38px; object-fit: cover;">
                        <i class="mdi mdi-chevron-down d-none d-xl-inline-block ms-1 text-muted"></i>
                    </div>
                </button>
                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animated shadow-lg border-0 py-0 overflow-hidden mt-2"
                    style="width: 280px; border-radius: 20px;">
                    <div class="p-3 bg-primary bg-gradient border-bottom">
                        <div class="d-flex align-items-center">
                            <img class="rounded-circle border border-2 border-white border-opacity-50"
                                src="assets/images/users/avatar-6.png" height="48" width="48">
                            <div class="ms-3">
                                <h6 class="text-white m-0 fw-bold">Charlie Stone</h6>
                                <span class="text-white-50 fs-12">charlie@clivax.com</span>
                            </div>
                        </div>
                    </div>
                    <div class="p-2">
                        <a class="dropdown-item d-flex align-items-center py-2 rounded-3" href="#!">
                            <div class="avatar-xs me-3">
                                <span class="avatar-title bg-primary-subtle text-primary rounded-circle"><i
                                        class="ri-user-line"></i></span>
                            </div>
                            <span>My Profile</span>
                        </a>
                        <a class="dropdown-item d-flex align-items-center py-2 rounded-3" href="#!">
                            <div class="avatar-xs me-3">
                                <span class="avatar-title bg-info-subtle text-info rounded-circle"><i
                                        class="ri-settings-3-line"></i></span>
                            </div>
                            <span>Settings</span>
                        </a>
                        <a class="dropdown-item d-flex align-items-center py-2 rounded-3" href="#!">
                            <div class="avatar-xs me-3">
                                <span class="avatar-title bg-success-subtle text-success rounded-circle"><i
                                        class="ri-wallet-3-line"></i></span>
                            </div>
                            <span>Billing</span>
                        </a>
                    </div>
                    <div class="p-3 bg-light-subtle border-top">
                        <a href="javascript:void(0);" onclick="logout()"
                            class="btn btn-soft-danger w-100 fw-bold rounded-pill">
                            <i class="ri-logout-box-r-line me-2"></i>Sign out
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</header>
<!-- End topbar -->
