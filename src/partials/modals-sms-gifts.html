<!-- Send Mass SMS Modal -->
<!-- ─────────────────────────────────────────────────────────────────────────── -->
<div class="modal fade" id="sendSmsModal" tabindex="-1" role="dialog" aria-labelledby="sendSmsModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header border-bottom">
                <h5 class="modal-title" id="sendSmsModalLabel">
                    <i class="ri-mail-send-line me-2"></i>Send Mass SMS
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body p-3">

                <!-- Template Selection -->
                <div class="mb-3">
                    <label for="smsTemplateSelect" class="form-label fw-500">Select Template</label>
                    <select class="form-select form-select-sm" id="smsTemplateSelect">
                        <option value="">-- Custom Message --</option>
                        <!-- Templates will be loaded here by JS -->
                    </select>
                </div>

                <!-- Template Management Actions -->
                <div class="mb-3">
                    <label for="smsTemplateName" class="form-label fw-500">Template Name</label>
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control" id="smsTemplateName" placeholder="Enter name to save or edit...">
                        <button class="btn btn-success" type="button" id="createTemplateBtn">Create</button>
                        <button class="btn btn-outline-warning" type="button" id="updateTemplateBtn" style="display: none;">Update</button>
                        <button class="btn btn-outline-danger" type="button" id="deleteTemplateBtn" style="display: none;">Delete</button>
                    </div>
                </div>

                <!-- SMS Message Editor -->
                <div class="mb-3">
                    <label for="smsMessage" class="form-label fw-500">Message</label>
                    <textarea class="form-control form-control-sm" id="smsMessage" rows="6"
                        placeholder="Type your SMS message here... (Max 160 characters per message)" maxlength="480">
                    </textarea>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <small class="text-muted">
                            <span id="charCount">0</span>/480 characters
                        </small>
                        <small class="text-muted">
                            Estimated messages: <span id="msgCount" class="badge bg-info">0</span>
                        </small>
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="modal-footer border-top">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="sendSmsBtn">
                    <i class="ri-send-plane-2-line me-2"></i>Send SMS
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ─────────────────────────────────────────────────────────────────────────── -->
<!-- Award Gifts Modal -->
<!-- ─────────────────────────────────────────────────────────────────────────── -->
<div class="modal fade" id="awardGiftsModal" tabindex="-1" role="dialog" aria-labelledby="awardGiftsModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header border-bottom">
                <h5 class="modal-title" id="awardGiftsModalLabel">
                    <i class="ri-gift-2-line me-2"></i>Award Gifts
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <!-- Gift Type Selection -->
                <div class="row mb-4">
                    <div class="col-12">
                        <label class="form-label fw-500 mb-3">Select Gift Type</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="giftType" id="giftCash" value="cash"
                                autocomplete="off" checked>
                            <label class="btn btn-outline-success" for="giftCash">
                                <i class="ri-money-dollar-circle-line me-2"></i>Cash
                            </label>

                            <input type="radio" class="btn-check" name="giftType" id="giftBonus" value="bonus"
                                autocomplete="off">
                            <label class="btn btn-outline-info" for="giftBonus">
                                <i class="ri-star-smile-line me-2"></i>Bonus
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Cash Gift Panel -->
                <div id="cashPanel" class="panel-content">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="cashType" class="form-label fw-500">Cash Type</label>
                            <select class="form-select form-select-sm" id="cashType">

                                <option value="withdrawable">Withdrawable</option>
                                <option value="non-withdrawable">Non-Withdrawable</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="cashAmount" class="form-label fw-500">Amount</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text" id="currencySymbol">KES</span>
                                <input type="number" class="form-control" id="cashAmount" placeholder="0.00" min="0"
                                    step="0.01">
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="cashDescription" class="form-label fw-500">Description (Optional)</label>
                            <textarea class="form-control form-control-sm" id="cashDescription" rows="3"
                                placeholder="e.g., Welcome Bonus, Performance Award, etc."></textarea>
                        </div>

                        <!-- <div class="col-12">
                            <div class="alert alert-info alert-sm mb-0" role="alert">
                                <i class="ri-information-line me-2"></i>
                                <strong>Withdrawable:</strong> Users can transfer to their bank account.
                                <strong>Non-Withdrawable:</strong> Can only be used for trading/purchases.
                            </div>
                        </div> -->
                    </div>
                </div>

                <!-- Bonus Gift Panel -->
                <div id="bonusPanel" class="panel-content" style="display:none;">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="bonusType" class="form-label fw-500">Select Bonus</label>
                            <select class="form-select form-select-sm" id="bonusType">

                                <option value="trade-credit">Freebet Bonus</option>
                                <option value="cashback-10">10% Cashback</option>
                                <option value="cashback-15"> Deposit Bonus</option>
                                <option value="premium-features">Referral Bonus</option>
                                <option value="vip-status">Registration Bonus</option>
                                <option value="fee-waiver">Transaction Fee Waiver</option>
                                <option value="double-points">Double Points (30 days)</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="bonusDescription" class="form-label fw-500">Description (Optional)</label>
                            <textarea class="form-control form-control-sm" id="bonusDescription" rows="3"
                                placeholder="Add any additional details about this bonus..."></textarea>
                        </div>

                        <!-- <div class="col-12">
                            <div class="alert alert-info alert-sm mb-0" role="alert">
                                <i class="ri-information-line me-2"></i>
                                <strong>Bonuses</strong> are special perks that enhance user experience and engagement.
                            </div>
                        </div> -->
                    </div>
                </div>

                <!-- Targeting Info -->
                <!-- <div class="mt-4 pt-3 border-top">
                    <div class="alert alert-warning alert-sm mb-0">
                        <i class="ri-group-line me-2"></i>
                        Targeting <strong>all players</strong> in the current segment.
                    </div>
                </div> -->

                <!-- Summary Card -->
                <div class="card bg-light border-0 mt-4">
                    <div class="card-body p-3">
                        <h6 class="card-title mb-3">
                            <i class="ri-checkbox-circle-line me-2 text-success"></i>Summary
                        </h6>
                        <div id="giftSummary" class="small">
                            <p class="mb-2"><strong>Gift Type:</strong> <span id="summaryType">-</span></p>
                            <p class="mb-2"><strong>Details:</strong> <span id="summaryDetails">-</span></p>

                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer border-top">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="awardGiftBtn">
                    <i class="ri-check-double-line me-2"></i>Award Gift
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification for feedback -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="actionToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <i class="ri-checkbox-circle-line me-2"></i>
            <strong class="me-auto" id="toastTitle">Action</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastMessage">
            Operation completed successfully!
        </div>
    </div>
</div>
