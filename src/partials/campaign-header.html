<style>
    .dropdown-item:hover,
    .dropdown-item:focus {
        color: var(--bs-primary) !important;
        background-color: var(--bs-light) !important;
    }
</style>
<div class="page-title-right">
    <ol class="breadcrumb m-0 text-sm">
        <li class="breadcrumb-item"><a href="javascript: void(0);">Campaigns</a></li>
        <li class="breadcrumb-item active">Create Campaigns</li>
    </ol>
</div>
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <h3 class="mb-0">Create Campaign</h3>
    <div class="d-flex flex-wrap justify-content-md-end gap-2 gap-sm-3">
        <button class="btn btn-outline-primary"><i class="fa fa-user-tag me-1"></i><span
                class="d-none d-sm-inline">Calculate recipients</span><span
                class="d-inline d-sm-none">Recipients</span></button>
        <div class="btn-group">
            <button type="button" class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown"
                aria-expanded="false">
                Save <i class="mdi mdi-chevron-down"></i>
            </button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">Save as Draft</a>
                <a class="dropdown-item" href="#">Save as Template</a>
            </div>
        </div>
        <a href="pages-starter2.html" class="btn btn-primary"><i class="mdi mdi-check me-1"></i>Next</a>
    </div>
</div>
<div class="overflow-x-auto pb-2" style="scrollbar-width: thin;">
    <ol class="d-flex gap-4 gap-md-5 list-unstyled mb-0" style="min-width: max-content;">
        <li class="@@if (current_step == 'setup') {text-primary} @@if (current_step != 'setup') {text-muted}"><a
                href="pages-starter.html"
                class="@@if (current_step == 'setup') {text-primary} @@if (current_step != 'setup') {text-muted}">Setup
            </a></li>
        <li class="@@if (current_step == 'template') {text-primary} @@if (current_step != 'template') {text-muted}"><a
                href="pages-starter2.html"
                class="@@if (current_step == 'template') {text-primary} @@if (current_step != 'template') {text-muted}">Template
            </a></li>
        <li class="@@if (current_step == 'recipients') {text-primary} @@if (current_step != 'recipients') {text-muted}">
            <a href="pages-starter3.html"
                class="@@if (current_step == 'recipients') {text-primary} @@if (current_step != 'recipients') {text-muted}">Recipients
            </a>
        </li>
        <li class="@@if (current_step == 'schedule') {text-primary} @@if (current_step != 'schedule') {text-muted}"><a
                href="pages-starter4.html"
                class="@@if (current_step == 'schedule') {text-primary} @@if (current_step != 'schedule') {text-muted}">Schedule
            </a></li>
        <li class="@@if (current_step == 'review') {text-primary} @@if (current_step != 'review') {text-muted}"><a
                href="pages-starter5.html"
                class="@@if (current_step == 'review') {text-primary} @@if (current_step != 'review') {text-muted}">Review
                & Launch </a></li>
        <li class="@@if (current_step == 'analytics') {text-primary} @@if (current_step != 'analytics') {text-muted}"><a
                href="pages-starter6.html"
                class="@@if (current_step == 'analytics') {text-primary} @@if (current_step != 'analytics') {text-muted}">Analytics
            </a></li>
    </ol>
</div>
