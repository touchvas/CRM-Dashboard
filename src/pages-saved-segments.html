<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Saved Segments | Clivax - Admin Dashboard Template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
    <meta content="Themesbrand" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">

    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />
    <!-- Custom Typography CSS -->
    <link href="assets/css/custom-typography.css" rel="stylesheet" type="text/css" />

    <style>
        /* Prevents content flashing before redirect */
        body { display: none !important; }
        .is-authenticated body { display: block !important; }
    </style>
    <script>
        if (!sessionStorage.getItem('isLoggedIn')) { window.location.href = 'auth-login.html'; }
        else { document.documentElement.classList.add('is-authenticated'); }
    </script>
</head>

<body>

    <!-- Begin page -->
    <div id="layout-wrapper">

        <!--#include file="partials/topbar.html" -->
        @@include("partials/topbar.html")
        @@include("partials/sidebar.html")

        <!-- ============================================================== -->
        <!-- Start right Content here -->
        <!-- ============================================================== -->
        <div class="main-content">

            <div class="page-content">
                <div class="container-fluid">

                    <!--#include file="partials/saved-segments.html" -->
                    @@include("partials/saved-segments.html")

                </div> <!-- container-fluid -->
            </div>
            <!-- End Page-content -->

            <!--#include file="partials/footer.html" -->

        </div>
        <!-- end main content-->
        @@include("partials/footer.html")
    </div>
    <!-- END layout-wrapper -->

    <!--#include file="partials/right-sidebar.html" -->

    <!-- JAVASCRIPT -->
    <script src="assets/libs/jquery/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/metismenu/metisMenu.min.js"></script>
    <script src="assets/libs/simplebar/simplebar.min.js"></script>
    <script src="assets/libs/node-waves/waves.min.js"></script>

</body>

</html>
